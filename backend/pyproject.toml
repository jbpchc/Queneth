[project]
name = "queneth-api"
version = "0.1.0"
description = "Queneth — multi-vendor fashion marketplace API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "sqlalchemy[asyncio]>=2.0,<2.2",
  "asyncpg>=0.32,<1",
  "alembic>=1.20,<2",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "email-validator>=2.2,<3",
  "pyjwt>=2.15,<3",
  "pwdlib[argon2]>=0.3,<1",
  "slowapi>=0.1.10,<1",
  "httpx>=0.28,<1",
  "tenacity>=9.2,<10",
  "apscheduler>=3.11,<4",
  "structlog>=26.1",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.0",
  "aiosqlite>=0.22",
  "ruff>=0.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: needs a real Postgres TEST_DATABASE_URL (row locks, concurrency)"]

[tool.coverage.run]
source = ["app/services", "app/core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# Seed data reads best as one record per line.
"app/seed/*" = ["E501"]
"app/services/product_art.py" = ["E501"]
